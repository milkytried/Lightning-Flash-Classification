[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-capstone"
version = "0.1.0"
description = "Metadata and satellite lightning classification for real Malaysian meteorological data"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["lightning", "satellite", "meteorology", "deep-learning"]
authors = [{ name = "Chai Wen Cheng" }]
