# Lightning Flash Classification - final aligned-run configuration
# Author: Chai Wen Cheng
# Project: CNN-based classification of cloud-to-ground lightning using Himawari-9

project:
  name: "Lightning Flash Classification"
  description: "Aligned Himawari-9 and MMD satellite CNN for same-time lightning classification"
  version: "1.0"

# HEADLINE MODEL: Himawari-9 satellite CNN (image-pixels-only classifier)
data:
  # Raw data and processed artifacts are gitignored.
  raw_himawari_dir: "data/raw/himawari_hsd/"
  raw_mmd_csv: "data/raw/mmd_lightning/"
  satellite_dataset_csv: "data/processed/satellite_dataset.csv"
  # Matches MALAYSIA_BOUNDS in src/build_satellite_dataset.py.
  region_bbox: [99.0, 120.0, -5.0, 15.0]   # [lon_min, lon_max, lat_min, lat_max]
  satellite: "Himawari-9"
  bands: ["B08", "B13", "B15"]
  aligned_patch_count: 41168
  split_counts: {train: 33226, val: 3324, test: 4618}

preprocessing:
  patch_size: 64
  num_channels: 3
  channel_order: ["B08", "B13", "B15"]
  normalization: "imagenet"
  split_strategy: "chronological_by_frame_date"
  max_patch_black_fraction: 0.02
  # The aligned 2023-2025 dataset has no date overlap across splits.

model:
  architecture: "ResNet50"
  pretrained: true
  freeze_backbone: true
  num_input_channels: 3
  num_classes: 1
  dropout: 0.5
  trainable_parameters: 262401
  frozen_parameters: 23508032

train:
  batch_size: 32
  eval_batch_size: 128
  max_epochs: 50
  backbone_learning_rate: 0.00001
  head_learning_rate: 0.001
  optimizer: "Adam_head_only"
  loss_function: "FocalLoss"
  loss_alpha: 0.25
  loss_gamma: 2.0
  gradient_clip_norm: 1.0
  early_stopping_patience: 5
  seed: 42
  device: "cpu"

evaluation:
  # Select on validation only, freeze, then apply once to test.
  threshold_selection: "validation_f1_max"
  selected_threshold: 0.51
  compute_roc: true
  save_confusion_matrix: true

paths:
  models_dir: "models/"
  results_dir: "results/"
  logs_dir: "logs/"

# BASELINE ONLY (NOT a deployment result): lightning metadata MLP
# amplitude and strike_type are strike-derived fields, so the apparent perfect
# score is label leakage. See scripts/retrain_honest_artifacts.py.
# Reference settings:
#   input_features: [lat, lon, amplitude, strike_type]
#   hidden_size: 256
#   batch_size: 512
#   optimizer: Adam + ReduceLROnPlateau
#   loss_function: FocalLoss (alpha=0.25, gamma=2.0)
